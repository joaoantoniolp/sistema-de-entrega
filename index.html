<!DOCTYPE html>

<head>

  <title>Sistema de Entregas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Login</h2>
<input type="password" id="senha" placeholder="Digite a senha">

  <input id="valor" placeholder="Valor">

</div>


<script src="script.js"></script>
</body>
</html>
